[package]
name = "wc3-server"
version = "0.1.0"
edition = "2024"
description = "Language backend of the WC3 VS Code extension (binary protocol over stdio) — parses, lints and highlights JASS/vJASS, Zinc, Lua, AngelScript and BNI via jass-rs / zinc-rs / lua-rs / as-rs / bni-rs, reads wc3.bni projects, and decodes BLP textures for the viewer. Also a library: the project model wc3-mcp uses in-process."
license = "CC0-1.0"

# The project model, for other tools (wc3-mcp) as well as the binary.
[lib]
name = "wc3_server"
path = "src/lib.rs"

[[bin]]
name = "wc3-server"
path = "src/main.rs"

[dependencies]
parser-rs = { path = "../../parser-rs" }
jass-rs = { path = "../../jass-rs" }
zinc-rs = { path = "../../zinc-rs" }
lua-rs = { path = "../../lua-rs" }
as-rs = { path = "../../as-rs" }
bni-rs = { path = "../../bni-rs" }
slk-rs = { path = "../../slk-rs" }
wts-rs = { path = "../../wts-rs" }
w3abdhqtu-rs = { path = "../../w3abdhqtu-rs" }
w3c-rs = { path = "../../w3c-rs" }
w3e-rs = { path = "../../w3e-rs" }
w3i-rs = { path = "../../w3i-rs" }
w3r-rs = { path = "../../w3r-rs" }
w3s-rs = { path = "../../w3s-rs" }
wct-rs = { path = "../../wct-rs" }
wpm-rs = { path = "../../wpm-rs" }
imp-rs = { path = "../../imp-rs" }
mmp-rs = { path = "../../mmp-rs" }
shd-rs = { path = "../../shd-rs" }
doo-rs = { path = "../../doo-rs" }
wtg-rs = { path = "../../wtg-rs" }
w3o-rs = { path = "../../w3o-rs" }
storm-rs = { path = "../../storm-rs" }
# Decoding only: no libjpeg-turbo (a C build), so cross-compiling stays
# pure Rust.
blp = { path = "../../blp-rs", default-features = false }
# TGA for the viewer (map previews, loading screens): the `image` crate
# blp-rs already uses, pure Rust.
image = { version = "0.25.8", default-features = false, features = ["tga"] }
notify = "8.2.0"

# The parsers do the heavy work: optimize them even in debug builds, so a
# debug server (build-mac.sh) keeps up with big map scripts while the
# server crate itself still builds fast.
[profile.dev.package."*"]
opt-level = 3
