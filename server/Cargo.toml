[package]
name = "wc3-server"
version = "0.1.0"
edition = "2021"
description = "Language backend of the WC3 VS Code extension (binary protocol over stdio) — parses, lints and highlights JASS/vJASS, Zinc, Lua, AngelScript and BNI via jass-rs / zinc-rs / lua-rs / as-rs / bni-rs, and reads wc3.bni projects."
license = "CC0-1.0"

[[bin]]
name = "wc3-server"
path = "src/main.rs"

[dependencies]
parser-rs = { path = "../../parser-rs" }
jass-rs = { path = "../../jass-rs" }
zinc-rs = { path = "../../zinc-rs" }
lua-rs = { path = "../../lua-rs" }
as-rs = { path = "../../as-rs" }
bni-rs = { path = "../../bni-rs" }
notify = "8.2.0"
